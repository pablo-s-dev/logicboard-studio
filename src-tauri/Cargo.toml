[package]
name = "logicboard-studio"
version = "0.1.1"
description = "Interactive VHDL simulator for FPGA development boards"
authors = ["LogicBoard Studio"]
edition = "2021"

[lib]
name = "logicboard_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
