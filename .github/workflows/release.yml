name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows installer
    runs-on: windows-2025

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up GHDL
        uses: ghdl/setup-ghdl@v1
        with:
          version: 6.0.0
          backend: mcode

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        shell: powershell
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          $expectedTag = "v$packageVersion"
          if ($tauriVersion -ne $packageVersion -or $cargoVersion -ne $packageVersion) {
            throw "Version mismatch: package=$packageVersion, tauri=$tauriVersion, cargo=$cargoVersion"
          }
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match application version $packageVersion"
          }

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Bundle GHDL with the application
        shell: powershell
        run: npm run prepare:ghdl

      - name: Build installer and publish the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LogicBoard Studio ${{ github.ref_name }}
          releaseBody: Download the Windows setup executable below. GHDL is included in the installer.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: LogicBoard-Studio-[version]-Windows-[arch][setup][ext]
